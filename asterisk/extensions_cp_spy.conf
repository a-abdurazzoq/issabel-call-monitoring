; Call Monitoring (control_panel): confirmation before listening on an
; external number. Installed by install.sh to /etc/asterisk/ and included
; from extensions_custom.conf.
;
; The module originates the call to the supervisor's external number into
; this context, with CP_SPY = "<agent device>^<ChanSpy mode letters>",
; e.g. "PJSIP/102^w". After the answer the supervisor hears a beep and must
; press 1. Voicemail or an answering machine never presses 1, so the call is
; hung up after three beeps and the conversation is not sent there.

[cp-spy-confirm]
exten => s,1,Answer()
 same => n,Set(CP_TRIES=0)
 same => n(ask),Read(CP_OK,beep,1,,1,5)
 same => n,GotoIf($["${CP_OK}" = "1"]?spy)
 same => n,Set(CP_TRIES=$[${CP_TRIES} + 1])
 same => n,GotoIf($[${CP_TRIES} < 3]?ask)
 same => n,Hangup()
 same => n(spy),ChanSpy(${CUT(CP_SPY,^,1)}-,qdE${CUT(CP_SPY,^,2)})
 same => n,Hangup()
